
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-PI-3 성격진단 해석 전문가</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- HTML to PDF conversion library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        
        /* PDF 저장 시 화면과 동일한 레이아웃을 강제하기 위한 스타일 */
        .pdf-export-mode {
            width: 1000px !important; /* 충분한 너비 확보하여 md 레이아웃 유지 */
            background-color: white !important;
            margin: 0 !important;
            padding: 40px !important;
            box-shadow: none !important;
        }

        /* 그리드 레이아웃 유지 (화면과 동일하게 2열 구성 강제) */
        .pdf-export-mode .md\:grid-cols-2 {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 24px !important;
        }

        .pdf-export-mode .md\:flex-row {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 32px !important;
        }

        .pdf-export-mode .md\:w-1\/2 {
            width: 50% !important;
        }

        /* 섹션 및 페이지 분할 최적화 */
        .pdf-export-mode section, 
        .pdf-export-mode .report-header-box {
            page-break-inside: avoid !important;
            margin-bottom: 30px !important;
        }

        /* 스크롤바 제거 및 배경색 강제 */
        .pdf-export-mode {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .pdf-export-mode .no-print {
            display: none !important;
        }

        /* 폰트 크기 미세 조정 (PDF 가독성) */
        .pdf-export-mode h2 { font-size: 32pt !important; line-height: 1.2 !important; }
        .pdf-export-mode h3 { font-size: 22pt !important; line-height: 1.3 !important; }
        .pdf-export-mode .text-\[11pt\], 
        .pdf-export-mode .text-\[11\.5pt\] { 
            font-size: 11pt !important; 
            line-height: 1.7 !important; 
        }

        @keyframes bounce-y {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        .group-hover\:bounce-y:group-hover {
          animation: bounce-y 0.6s ease-in-out infinite;
        }

        /* 차트 컨테이너 높이 고정 (캡처 시 깨짐 방지) */
        .pdf-export-mode .recharts-responsive-container {
            height: 400px !important;
            min-height: 400px !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
